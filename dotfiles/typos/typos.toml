[default]
extend-ignore-re = ['\[[0-9a-f]{7}\]', '(?Rm)^.*(#|--|//)\s*spellchecker:disable-line$', '(?s)(#|--|//|)\s*spellchecker:off.*?\n\s*(#|--|//)\s*spellchecker:on', '\bTLS_[A-Z0-9_]+(_anon_[A-Z0-9_]+)?\b']
extend-ignore-words-re = ['\A[a-zA-Z]{1,3}\z']

[default.extend-words]
AKS = "AKS"
aks = "aks"
electricrain = "electricrain"
iterm = "iterm"
noice = "noice"
protols = "protols"

[files]
extend-exclude = ["*.css", "*.lock", "*.min.css", "*.min.js", "*.plist", "*lock.json", ".git/", ".github/", ".typos.toml", "_typos.toml", "go.mod", "go.sum", "node_modules", "pnpm-lock.yaml", "typos.toml", "vendor/**/*"]
