[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]

[project]
name = "nix"
version = "0.1.0"
description = "Nix Package Upstream Checker"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "rich", "typer" ]
scripts.check-upstream-packages = "scripts.check_upstream_packages:main"
scripts.safaricloudtabs = "scripts.safaricloudtabs:app"

[tool.uv]
index = [ { name = "pypi", url = "https://pypi.org/simple", default = true } ]
package = true
build-backend.module-name = "scripts"
build-backend.module-root = ""
